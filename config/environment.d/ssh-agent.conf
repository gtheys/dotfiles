# AIDEV-NOTE: systemd user services (e.g. dms.service) do not inherit the
# niri/zsh session env. Without this, DMS's go-git plugin update check fails
# on SSH remotes with "SSH agent requested but SSH_AUTH_SOCK not-specified".
# Uses the systemd ssh-agent.service socket (gpg-agent refuses ssh-add, so it
# holds no SSH identities; go-git only authenticates via the agent).
# Key must be loaded once per boot: ssh-add ~/.ssh/id_ed25519
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
