onboarding = false

[theme]

name = "tokyo-night"

[terminal]

new_cwd = "follow"

[update]

[keys]

prefix = "ctrl+a"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "herdr-zoxide.browse"
description = "Browse zoxide directories"

[[keys.command]]
key = "prefix+alt+l"
type = "pane"
command = "lazygit"
description = "run lazygit"

[[keys.command]]
key = "prefix+alt+b"
type = "pane"
command = "btop"
description = "run btop"

[[keys.command]]
key = "alt+shift+g"
type = "plugin_action"
command = "chmarax.gitview.toggle" # sidebar in the current tab
description = "git view sidebar"

[[keys.command]]
key = "alt+g"
type = "plugin_action"
command = "chmarax.gitview.toggle-tab" # dedicated gitview tab
description = "git view tab"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"


[ui]


agent_panel_sort = "spaces"
[ui.toast]

delivery = "off"
[ui.toast.herdr]

[ui.toast.clipboard]

[ui.sound]


[session]

[remote]

[experimental]
kitty_graphics = true

[advanced]
