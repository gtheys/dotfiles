# AIDEV-NOTE: XDG_CURRENT_DESKTOP=mango:GNOME made the portal picker choose the
# gnome backend for ScreenCast, which needs mutter's D-Bus API and fails on
# mango (wlroots). Force wlroots portal for capture; gnome/gtk for the rest.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
