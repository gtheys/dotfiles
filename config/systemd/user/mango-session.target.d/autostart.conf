[Unit]
# AIDEV-NOTE: package mango-session.target (unlike niri.service) does not pull
# xdg-desktop-autostart.target, so XDG autostart apps (1Password, Nextcloud,
# nm-applet, ...) never launched in a mango session and op-env-populate.service
# had no 1Password to read from. Mirrors niri.service's own lines.
Wants=xdg-desktop-autostart.target
Before=xdg-desktop-autostart.target
