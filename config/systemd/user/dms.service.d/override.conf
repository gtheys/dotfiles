[Unit]
# AIDEV-NOTE: dms.service and op-env-populate.service are both pulled in by
# graphical-session.target with no inherent order — race meant DMS often
# started before the 1Password cache file existed. Force ordering here.
After=op-env-populate.service

[Service]
# EnvironmentFile format matches op-env-populate.service's KEY=VALUE dump.
# Leading '-' = optional, don't fail startup if cache isn't there yet.
EnvironmentFile=-/dev/shm/op-env-cache
