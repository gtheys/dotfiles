# MangoWM configuration mirroring the niri session where Mango has a direct equivalent.
# AIDEV-NOTE: Mango uses numeric tags, not named workspaces. Tags 1-9 map to niri
# workspaces 1-9. Niri-only column operations are intentionally listed at the end.

# Environment shared with the niri session.
env=CLUTTER_BACKEND,wayland
env=GDK_DPI_SCALE,1
env=GDK_SCALE,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORMTHEME_QT6,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=SDL_VIDEODRIVER,wayland
env=SSH_AUTH_SOCK,/run/user/1000/ssh-agent.socket
env=GSK_RENDERER,ngl
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=WLR_NO_HARDWARE_CURSORS,1
env=DMS_DISABLE_MATUGEN,1
env=QT_MEDIA_BACKEND,ffmpeg
env=QT_FFMPEG_DECODING_HW_DEVICE_TYPES,vaapi
env=QT_FFMPEG_ENCODING_HW_DEVICE_TYPES,vaapi
env=XDG_CURRENT_DESKTOP,mango:GNOME

# Monitors. Positive coordinates are required for XWayland.
monitor_rule=name:^eDP-1$,width:3840,height:2400,refresh:60,x:0,y:560,scale:1.5
monitor_rule=name:^(DP-2|HDMI-A-1)$,width:3840,height:2160,refresh:59.997,x:2560,y:0,scale:1.0,primary:1

# Input, matching niri and the DMS-generated niri input config.
repeat_rate=25
repeat_delay=200
numlock_on=0
xkb_rules_layout=us,fr
xkb_rules_options=grp:ctrl_shift_toggle

mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0

tap_to_click=1
tap_and_drag=0
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=0.2
trackpad_scroll_method=1
trackpad_click_method=2
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0

# Appearance, matched to niri's 8px gaps, blue 4px focus ring, radius, and shadow.
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
border_px=4
border_radius=8
root_color=0x1a1b26ff
border_color=0xffffff00
focus_color=0x07b5efff
urgent_color=0xad401fff

shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=5
shadows_blur=40
shadows_position_x=0
shadows_position_y=5
shadows_color=0x00000077

blur=0
blur_layer=0
focused_opacity=1.0
unfocused_opacity=1.0
animations=1
layer_animations=1

cursor_size=24
cursor_theme=Adwaita
cursor_hide_timeout=10000

# Scroller is Mango's closest equivalent to niri's scrolling columns.
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=0.5
scroller_proportion_preset=0.33333,0.5,0.66667

# AIDEV-NOTE: new_is_master=0 so new windows enter the stack column on the
# right instead of stealing the master slot on the left.
new_is_master=0
default_master_factor=0.5
default_master_count=1
tag_num=9
smart_gaps=0
# tile (master-stack) is the default; switch_layout cycles tile <-> scroller.
circle_layout=tile,scroller
tag_rule=id:*,layout_name:tile

# Startup programs shared with niri. DMS itself is started by dms.service.
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XAUTHORITY
exec_once=/usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec_once=wl-paste --watch cliphist store
exec_once=journalctl-desktop-notification
exec_once=easyeffects --gapplication-service
exec_once=firefox
exec_once=xhost si:localuser:root
exec_once=sh -c 'sleep 3; amixer -c2 set Master 100% unmute'
exec_once=gsettings set org.gnome.desktop.interface gtk-theme Arc
exec_once=gsettings set org.gnome.desktop.interface icon-theme Adwaita
exec_once=gsettings set org.gnome.desktop.interface cursor-theme Adwaita
exec_once=gsettings set org.gnome.desktop.interface text-scaling-factor 1
exec_once=gsettings set org.gnome.desktop.interface cursor-size 24
exec_once=gsettings set org.gnome.desktop.interface color-scheme prefer-light

# Window rules carried over from niri.
window_rule=force_fake_maximize:1,app_id:^firefox$
window_rule=is_floating:1,is_open_silent:1,width:0.3,height:0.3,app_id:^(firefox|zen)$,title:^Picture-in-Picture$
window_rule=is_floating:1,width:0.45,height:0.45,app_id:^(confirm|pavucontrol|blueman|nm-connection-editor|easyeffects|Hello|xdg-desktop-portal-gtk|system-config-printer|ghostty_journalctl|brave-keep)$
window_rule=is_floating:1,width:0.45,height:0.45,title:^(.*Extension.*Bitwarden.*|.*Reminder.*)$
window_rule=force_fake_maximize:1,tags:2,app_id:^dev.terminal$
window_rule=is_floating:1,app_id:^com.danklinux.dms$

# Application and DMS shortcuts.
bind=SUPER,Return,spawn,ghostty
bind=SUPER+ALT,V,spawn,dms ipc call clipboard toggle
bind=SUPER,N,spawn,dms ipc call notifications toggle
bind=SUPER,Space,spawn,dms ipc call spotlight toggle
bind=SUPER,X,spawn,dms ipc call powermenu toggle
bind=SUPER,Y,spawn,dms ipc call notepad open
bind=SUPER,E,spawn,thunar
bind=NONE,XF86Launch3,spawn,dms ipc call mpris playPause

# Screenshots, using the same scripts as niri.
bind=NONE,Print,spawn_shell,$HOME/.config/scripts/screenshot rc
bind=SUPER,Print,spawn_shell,$HOME/.config/scripts/screenshot rf
bind=CTRL,Print,spawn_shell,$HOME/.config/scripts/screenshot ri
bind=SUPER,Z,spawn_shell,$HOME/.config/scripts/screenshot ri
bind=SHIFT,Print,spawn_shell,$HOME/.config/scripts/screenshot sc
bind=SUPER+SHIFT,Print,spawn_shell,$HOME/.config/scripts/screenshot sf
bind=CTRL+SHIFT,Print,spawn_shell,$HOME/.config/scripts/screenshot si
bind=ALT,Print,spawn_shell,$HOME/.config/scripts/screenshot p

# Volume, brightness, keyboard backlight, and media keys.
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 10%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bindl=NONE,XF86KbdBrightnessDown,spawn,asusctl --prev-kbd-bright
bindl=NONE,XF86KbdBrightnessUp,spawn,asusctl --next-kbd-bright
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
# XF86AudioPause resolves to the same Mango key as XF86AudioPlay on this keyboard.

# Window and overview control.
# SUPER+O shows every window from every tag; SUPER+SHIFT+O only the current tag.
bind=SUPER,O,toggleoverview
bind=SUPER+SHIFT,O,toggleoverview,1
bind=SUPER,Q,killclient
bind=SUPER,H,focusdir,left
bind=SUPER,J,focus_window_or_workspace,down
bind=SUPER,K,focus_window_or_workspace,up
bind=SUPER,L,focusdir,right
bind=SUPER+ALT,H,move_client,left
bind=SUPER+ALT,J,move_client,down
bind=SUPER+ALT,K,move_client,up
bind=SUPER+ALT,L,move_client,right

# Tags 1-9 mirror niri workspaces 1-9.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+ALT,1,tag,1,0
bind=SUPER+ALT,2,tag,2,0
bind=SUPER+ALT,3,tag,3,0
bind=SUPER+ALT,4,tag,4,0
bind=SUPER+ALT,5,tag,5,0
bind=SUPER+ALT,6,tag,6,0
bind=SUPER+ALT,7,tag,7,0
bind=SUPER+ALT,8,tag,8,0
bind=SUPER+ALT,9,tag,9,0

# Scroller sizing and window state.
bind=SUPER,R,switch_proportion_preset
# In tile, SUPER+M stretches the focused window to the full screen (toggle).
# set_proportion,1.0 only applies to the scroller layout and was dead in tile.
bind=SUPER,M,togglemaximizescreen
bind=SUPER+ALT,M,set_proportion,0.9
bind=SUPER,F,togglefullscreen
bind=SUPER,Minus,resizewin,-50,+0
bind=SUPER,Equal,resizewin,+50,+0
bind=SUPER+ALT,Minus,resizewin,+0,-50
bind=SUPER+ALT,Equal,resizewin,+0,+50
bind=SUPER,T,togglefloating

# Layout control: cycle tile/scroller, promote focused window to master.
bind=SUPER+ALT,Space,switch_layout
bind=SUPER+SHIFT,Return,zoom

# Alt-tab thumbnail switcher over the current tag's windows.
# Releasing ALT commits the highlighted window.
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev

# Named scratchpad: SUPER+grave toggles a floating ghostty dropdown,
# launching it on first use. Size comes from the ratios below.
# AIDEV-NOTE: ghostty rejects --class values without a dot ("invalid 'class'"),
# and gtk-single-instance drops the flag, so both flags are required.
window_rule=is_named_scratchpad:1,app_id:com.geert.scratch
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.8
bind=SUPER,grave,toggle_named_scratchpad,com.geert.scratch,none,ghostty --gtk-single-instance=false --class=com.geert.scratch

# Named scratchpad: SUPER+SHIFT+N toggles Obsidian. Matches the app_id from
# StartupWMClass, so every Obsidian window is treated as the scratchpad.
window_rule=is_named_scratchpad:1,app_id:md.obsidian.Obsidian
bind=SUPER+SHIFT,N,toggle_named_scratchpad,md.obsidian.Obsidian,none,obsidian

bind=SUPER,F1,spawn,dms ipc call keybinds toggle mangowc

# Mouse bindings match the usual tiling behavior.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# AIDEV-NOTE: No direct Mango equivalent exists for niri's first/last column jump,
# consume/expel column, floating-vs-tiling focus toggle, tabbed column display,
# center-column, center-visible-columns, workspace-to-monitor move, or
# keyboard-shortcut inhibit toggle. Those niri binds are intentionally omitted
# instead of mapping them to misleading Mango actions.

# DMS Include Configs
source=./dms/cursor.conf
source = ./dms/binds.conf
